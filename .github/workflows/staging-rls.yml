name: Staging RLS Integration

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Confirm the isolated staging target
        required: true
        type: choice
        options:
          - levelup-dev

permissions:
  contents: read

jobs:
  verify-staging-rls:
    if: ${{ github.event_name == 'push' || inputs.target == 'levelup-dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require dedicated staging credentials
        shell: bash
        env:
          LEVELUP_RLS_TEST_URL: ${{ secrets.LEVELUP_STAGING_SUPABASE_URL }}
          LEVELUP_RLS_TEST_ANON_KEY: ${{ secrets.LEVELUP_STAGING_SUPABASE_ANON_KEY }}
          LEVELUP_RLS_OWNER_EMAIL: ${{ secrets.LEVELUP_STAGING_RLS_OWNER_EMAIL }}
          LEVELUP_RLS_OWNER_PASSWORD: ${{ secrets.LEVELUP_STAGING_RLS_OWNER_PASSWORD }}
          LEVELUP_RLS_OTHER_EMAIL: ${{ secrets.LEVELUP_STAGING_RLS_OTHER_EMAIL }}
          LEVELUP_RLS_OTHER_PASSWORD: ${{ secrets.LEVELUP_STAGING_RLS_OTHER_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            LEVELUP_RLS_TEST_URL \
            LEVELUP_RLS_TEST_ANON_KEY \
            LEVELUP_RLS_OWNER_EMAIL \
            LEVELUP_RLS_OWNER_PASSWORD \
            LEVELUP_RLS_OTHER_EMAIL \
            LEVELUP_RLS_OTHER_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret for ${name}."
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify staging RLS isolation
        env:
          LEVELUP_RLS_TEST_URL: ${{ secrets.LEVELUP_STAGING_SUPABASE_URL }}
          LEVELUP_RLS_TEST_ANON_KEY: ${{ secrets.LEVELUP_STAGING_SUPABASE_ANON_KEY }}
          LEVELUP_RLS_OWNER_EMAIL: ${{ secrets.LEVELUP_STAGING_RLS_OWNER_EMAIL }}
          LEVELUP_RLS_OWNER_PASSWORD: ${{ secrets.LEVELUP_STAGING_RLS_OWNER_PASSWORD }}
          LEVELUP_RLS_OTHER_EMAIL: ${{ secrets.LEVELUP_STAGING_RLS_OTHER_EMAIL }}
          LEVELUP_RLS_OTHER_PASSWORD: ${{ secrets.LEVELUP_STAGING_RLS_OTHER_PASSWORD }}
        run: node --test tests/rls-integration.test.mjs
