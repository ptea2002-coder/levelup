name: Browser and Mobile Smoke

on:
  push:
    branches: [p7-production-readiness]
  pull_request:
    branches: [p6-news-intelligence, p7-production-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      LEVELUP_TEST_CATALOG: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate optional staging-only browser credentials
        shell: bash
        env:
          STAGING_URL: ${{ secrets.LEVELUP_STAGING_SUPABASE_URL }}
          STAGING_KEY: ${{ secrets.LEVELUP_STAGING_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.LEVELUP_STAGING_RLS_OWNER_EMAIL }}
          E2E_PASSWORD: ${{ secrets.LEVELUP_STAGING_RLS_OWNER_PASSWORD }}
          EDITOR_EMAIL: ${{ secrets.LEVELUP_STAGING_EDITOR_EMAIL }}
          EDITOR_PASSWORD: ${{ secrets.LEVELUP_STAGING_EDITOR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$STAGING_URL" || -n "$STAGING_KEY" ]]; then
            [[ -n "$STAGING_URL" && -n "$STAGING_KEY" ]] || { echo "::error::Set both staging URL and publishable key, or leave both unset."; exit 1; }
            [[ "$STAGING_URL" == "https://ztzcpnyxgwhcdktpbxdq.supabase.co" ]] || { echo "::error::Browser tests may only write to the levelup-dev staging project."; exit 1; }
          fi
          if [[ -n "$E2E_EMAIL" || -n "$E2E_PASSWORD" ]]; then
            [[ -n "$E2E_EMAIL" && -n "$E2E_PASSWORD" && -n "$STAGING_URL" && -n "$STAGING_KEY" ]] || { echo "::error::Authenticated Game Locker smoke needs the staging URL/key and both owner-account credentials."; exit 1; }
          fi
          if [[ -n "$EDITOR_EMAIL" || -n "$EDITOR_PASSWORD" ]]; then
            [[ -n "$EDITOR_EMAIL" && -n "$EDITOR_PASSWORD" && -n "$STAGING_URL" && -n "$STAGING_KEY" ]] || { echo "::error::News Intelligence smoke needs the staging URL/key and both dedicated editor-account credentials."; exit 1; }
          fi
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned Playwright runner
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.LEVELUP_STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LEVELUP_STAGING_SUPABASE_ANON_KEY }}
      - name: Start production server
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.LEVELUP_STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LEVELUP_STAGING_SUPABASE_ANON_KEY }}
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/levelup-next.log 2>&1 &
          echo $! > /tmp/levelup-next.pid
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/levelup-next.log
            echo "::error::Next.js production server did not become healthy."
            exit 1
          fi
      - name: Check routes, guest flows, and optional authenticated Game Locker
        run: node scripts/browser-smoke.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.LEVELUP_STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LEVELUP_STAGING_SUPABASE_ANON_KEY }}
          LEVELUP_E2E_EMAIL: ${{ secrets.LEVELUP_STAGING_RLS_OWNER_EMAIL }}
          LEVELUP_E2E_PASSWORD: ${{ secrets.LEVELUP_STAGING_RLS_OWNER_PASSWORD }}
          LEVELUP_EDITOR_E2E_EMAIL: ${{ secrets.LEVELUP_STAGING_EDITOR_EMAIL }}
          LEVELUP_EDITOR_E2E_PASSWORD: ${{ secrets.LEVELUP_STAGING_EDITOR_PASSWORD }}
