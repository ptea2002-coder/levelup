name: LevelUP CI

on:
  push:
    branches: [main, v2-foundation, p3-1-editorial-hardening, p4-game-discovery, p4-discovery-ranking-fix]
  pull_request:
    branches: [main, v2-foundation, p3-1-editorial-hardening, p4-game-discovery]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test database and catalog guardrails
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
